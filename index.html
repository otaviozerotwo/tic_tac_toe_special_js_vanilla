<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
  <title>Tic Tac Toe Special</title>

  <link rel="stylesheet" href="./dist/css/main.css">
</head>
<body>
  <div class="container">
    <div class="bg-image-board" data-aos="zoom-in"></div>

      <span class="text-gradient-animation" data-aos="fade-left">Special</span>

    <button

      Set controls
    </button>

  <script>
    AOS.init();
