<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
  <title>Tic Tac Toe Special</title>

  <link rel="stylesheet" href="./src/css/main.scss">
</head>
<body>
  <section id="splash-screen">
    <div class="container">
      <div class="bg-image-board" data-aos="zoom-in"></div>
      <div class="title-container">
        <h1 data-aos="fade-down">Tic Tac Toe</h1>
        <span class="text-gradient-animation" data-aos="fade-left">Special</span>
      </div>
      <hr class="separator-bar">
      <button
        id="btn-open-settings" 
        class="btn-open-settings"
        data-aos="zoom-in"
      >
        Set controls
      </button>
    </div>
  </section>

  <section id="game-screen" hidden>
    <div class="board-container">
      <table id="board"></table>
    </div>
  </section>

  <dialog id="settings-dialog" inert>
    <form method="dialog">
      <div class="container">
        <div class="controls">
          <div class="symbol">
            <label for="symbol">Chose your symbol: </label>
            <label>
              <input type="radio" name="symbol" value="X" checked>
              X
            </label>
            <label>
              <input type="radio" name="symbol" value="O">
              O
            </label>
          </div>
      
          <div class="algorithm">
            <label for="algorithm">Chose the algorithm: </label>
            <label>
              <input type="radio" name="algorithm" value="minimax" checked>
              Minimax
            </label>
            <label>
              <input type="radio" name="algorithm" value="alphabeta">
              Alpha-Beta
            </label>
          </div>
          
          <div class="level">
            <label for="depth">Difficulty Level (1-3):</label>
            <input type="number" id="depth" value="3" min="1" max="3">
          </div>
          
          <div class="btn-replay-container">
            <button 
              id="btn-start-game" 
              class="btn-replay" 
              type="button"
              title="Start Game"
            >
              Start Game
            </button>
          </div>
        </div>
    </div>
    </form>
  </dialog>
  
  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>
  <script src="./src/js/main.js" type="module"></script>
</body>
</html>
